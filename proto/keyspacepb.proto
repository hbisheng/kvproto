syntax = "proto3";
package keyspacepb;

import "apipb.proto";
import "gogoproto/gogo.proto";
import "pdpb.proto";
import "rustproto.proto";

option java_package = "org.tikv.kvproto";
option (gogoproto.goproto_sizecache_all) = false;
option (gogoproto.goproto_unkeyed_all) = false;
option (gogoproto.goproto_unrecognized_all) = false;
option (gogoproto.marshaler_all) = true;
option (gogoproto.sizer_all) = true;
option (gogoproto.unmarshaler_all) = true;
option (rustproto.lite_runtime_all) = true;

// Namespace provides services to manage namespaces.
service Namespace {
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse) {}
  rpc LoadNamespace(LoadNamespaceRequest) returns (LoadNamespaceResponse) {}
  rpc GetAllNamespaces(GetAllNamespacesRequest) returns (GetAllNamespacesResponse) {}
  rpc UpdateNamespaceState(UpdateNamespaceStateRequest) returns (UpdateNamespaceStateResponse) {}
}

// Keyspace provides services to manage keyspaces.
service Keyspace {
  rpc LoadKeyspace(LoadKeyspaceRequest) returns (LoadKeyspaceResponse) {}
  rpc LookupKeyspace(LookupKeyspaceRequest) returns (LookupKeyspaceResponse) {}
  rpc LoadKeyspaceByID(LoadKeyspaceByIDRequest) returns (LoadKeyspaceResponse) {}
  // WatchKeyspaces first return all current keyspaces' metadata as its first response.
  // Then, it returns responses containing keyspaces that had their metadata changed.
  rpc WatchKeyspaces(WatchKeyspacesRequest) returns (stream WatchKeyspacesResponse) {}
  rpc UpdateKeyspaceState(UpdateKeyspaceStateRequest) returns (UpdateKeyspaceStateResponse) {}
  rpc GetAllKeyspaces(GetAllKeyspacesRequest) returns (GetAllKeyspacesResponse) {}
  // SelectKeyspaceEncryptionMetaFile atomically chooses the immutable CMEK
  // metadata file for one pending reused-keyspace CREATE reset.
  rpc SelectKeyspaceEncryptionMetaFile(SelectKeyspaceEncryptionMetaFileRequest) returns (SelectKeyspaceEncryptionMetaFileResponse) {}
}

message SelectKeyspaceEncryptionMetaFileRequest {
  pdpb.RequestHeader header = 1;
  uint32 keyspace_id = 2;
  uint64 generation = 3;
  uint64 restore_version = 4;
  uint64 candidate_file_id = 5;
}

message SelectKeyspaceEncryptionMetaFileResponse {
  pdpb.ResponseHeader header = 1;
  uint64 selected_file_id = 2;
}

message KeyspaceMeta {
  oneof keyspace {
    // V1/V2 compatibility keyspace id. V3 should read keyspace_identity instead.
    uint32 id = 1;
    // Canonical V3 keyspace identity.
    apipb.KeyspaceIdentity keyspace_identity = 8;
  }
  string name = 2;
  KeyspaceState state = 3;
  int64 created_at = 4;
  int64 state_changed_at = 5;
  map<string, string> config = 7;
  // PD-owned incarnation fence. Legacy metadata reads as generation zero.
  uint64 generation = 9;
  // Minimum RestoreShard version known to have been applied for this keyspace.
  uint64 restore_version = 10;
}

// KeyspaceTaskPhase distinguishes notification-only preparation from the two
// phases that authorize constrained empty resets.
enum KeyspaceTaskPhase {
  KEYSPACE_TASK_NONE = 0;
  KEYSPACE_TASK_PREPARE_RECLAIM = 1;
  KEYSPACE_TASK_RECLAIM = 2;
  // Kept for wire compatibility; this phase now authorizes the reused-Create
  // reset and its name describes the final validation that completes Create.
  KEYSPACE_TASK_VALIDATE_REUSE = 3;
}

// KeyspaceTask is returned atomically with KeyspaceMeta by LoadKeyspaceByID.
// CSE may execute RestoreShard only for KEYSPACE_TASK_RECLAIM.
message KeyspaceTask {
  KeyspaceTaskPhase phase = 1;
  uint32 keyspace_id = 2;
  uint64 expected_generation = 3;
  uint64 generation = 4;
  uint64 expected_restore_version = 5;
  uint64 restore_version = 6;
  uint64 region_id = 7;
  uint64 region_version = 8;
  uint64 conf_ver = 9;
  // Immutable single-winner CMEK metadata file selected for CREATE_REUSE.
  // Zero means that CSE must prepare a candidate and select it through PD.
  uint64 encryption_meta_file_id = 10;
}

enum KeyspaceState {
  ENABLED = 0;
  DISABLED = 1;
  ARCHIVED = 2;
  TOMBSTONE = 3;
}

message NamespaceMeta {
  uint32 id = 1;
  string name = 2;
  KeyspaceState state = 3;
  int64 created_at = 4;
  int64 state_changed_at = 5;
  map<string, string> config = 7;
}

message NamespaceRef {
  oneof namespace {
    // API V3 namespace id.
    uint32 namespace_id = 1;
    // API V3 namespace name.
    string namespace_name = 2;
  }
}

message CreateNamespaceRequest {
  pdpb.RequestHeader header = 1;
  string name = 2;
  map<string, string> config = 3;
}

message CreateNamespaceResponse {
  pdpb.ResponseHeader header = 1;
  NamespaceMeta namespace = 2;
}

message LoadNamespaceRequest {
  pdpb.RequestHeader header = 1;
  NamespaceRef namespace = 2;
}

message LoadNamespaceResponse {
  pdpb.ResponseHeader header = 1;
  NamespaceMeta namespace = 2;
}

message GetAllNamespacesRequest {
  pdpb.RequestHeader header = 1;
  uint32 start_id = 2;
  uint32 limit = 3;
}

message GetAllNamespacesResponse {
  pdpb.ResponseHeader header = 1;
  repeated NamespaceMeta namespaces = 2;
}

message UpdateNamespaceStateRequest {
  pdpb.RequestHeader header = 1;
  NamespaceRef namespace = 2;
  KeyspaceState state = 3;
}

message UpdateNamespaceStateResponse {
  pdpb.ResponseHeader header = 1;
  NamespaceMeta namespace = 2;
}

message LoadKeyspaceRequest {
  pdpb.RequestHeader header = 1;
  string name = 2;
  // V3 namespace-scoped name lookup. If unset, V3 name-only lookup should use LookupKeyspace and may return multiple keyspaces.
  NamespaceRef namespace = 3;
}

message LoadKeyspaceByIDRequest {
  pdpb.RequestHeader header = 1;
  oneof keyspace {
    // V1/V2 compatibility keyspace id. V3 should use keyspace_identity.
    uint32 id = 2;
    // V3 keyspace identity.
    apipb.KeyspaceIdentity keyspace_identity = 3;
  }
}

message LoadKeyspaceResponse {
  pdpb.ResponseHeader header = 1;
  KeyspaceMeta keyspace = 2;
  // Present only while a durable reclaim/reuse task is active for this ID.
  KeyspaceTask task = 3;
}

message LookupKeyspaceRequest {
  pdpb.RequestHeader header = 1;
  string name = 2;
}

message LookupKeyspaceResponse {
  pdpb.ResponseHeader header = 1;
  repeated KeyspaceMeta keyspaces = 2;
}

message WatchKeyspacesRequest {
  pdpb.RequestHeader header = 1;
}

message WatchKeyspacesResponse {
  pdpb.ResponseHeader header = 1;
  repeated KeyspaceMeta keyspaces = 2;
}

message UpdateKeyspaceStateRequest {
  pdpb.RequestHeader header = 1;
  oneof keyspace {
    // V1/V2 compatibility keyspace id. V3 should use keyspace_identity.
    uint32 id = 2;
    // V3 keyspace identity.
    apipb.KeyspaceIdentity keyspace_identity = 4;
  }
  KeyspaceState state = 3;
}

message UpdateKeyspaceStateResponse {
  pdpb.ResponseHeader header = 1;
  KeyspaceMeta keyspace = 2;
}

message GetAllKeyspacesRequest {
  pdpb.RequestHeader header = 1;
  oneof start_keyspace {
    // V1/V2 compatibility pagination cursor. V3 should use namespace_id and start_keyspace_identity.
    uint32 start_id = 2;
    // V3 pagination cursor within namespace_id.
    apipb.KeyspaceIdentity start_keyspace_identity = 5;
  }
  uint32 limit = 3;
  // V3 namespace-scoped pagination. Must be non-zero in V3.
  NamespaceRef namespace = 4;
}

message GetAllKeyspacesResponse {
  pdpb.ResponseHeader header = 1;
  repeated KeyspaceMeta keyspaces = 2;
}
